name: strapi-cms

services:
  strapi:
    build:
      context: ./strapi
      dockerfile: Dockerfile
    container_name: strapi-cms
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 1337
      # Content Jobs plugin -> host job runner. 172.18.0.1 is this bridge's
      # gateway; "localhost" here would mean the container itself.
      RUNNER_URL: ${RUNNER_URL:-http://172.18.0.1:4310}
      RUNNER_TOKEN: ${RUNNER_TOKEN}
      # Database
      DATABASE_CLIENT: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_SSL: "false"
      # Strapi secrets
      APP_KEYS: ${APP_KEYS}
      API_TOKEN_SALT: ${API_TOKEN_SALT}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET}
      TRANSFER_TOKEN_SALT: ${TRANSFER_TOKEN_SALT}
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      # Public URL
      PUBLIC_URL: https://strapi.fxnstudio.com
      URL: https://strapi.fxnstudio.com
      STRAPI_ADMIN_PREVIEW_BASE_URL: ${STRAPI_ADMIN_PREVIEW_BASE_URL:-https://preview.fxnstudio.com}
      # AI Writer plugin
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      AI_WRITER_ANTHROPIC_MODEL: ${AI_WRITER_ANTHROPIC_MODEL:-claude-opus-5}
      # 4096 could not hold a "medium" article: 800-1200 words of markdown plus
      # the SEO fields and key takeaway overran it, the response came back
      # truncated, and the run was thrown away after being paid for.
      AI_WRITER_MAX_TOKENS: ${AI_WRITER_MAX_TOKENS:-16000}
      # Fal.ai for AI image generation (per-article lifecycle hook)
      FAL_KEY: ${FAL_KEY}
      # Ultra takes aspect_ratio rather than the image_size presets; both callers
      # handle that. Schnell stays the fallback only if the var is unset.
      FAL_IMAGE_MODEL: ${FAL_IMAGE_MODEL:-fal-ai/flux-pro/v1.1-ultra}
    volumes:
      - strapi-uploads:/opt/app/public/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - fxn-net
    ports:
      - "127.0.0.1:8888:1337"

  postgres:
    image: postgres:16-alpine
    container_name: strapi-cms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME} -d ${DATABASE_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - fxn-net
    expose:
      - "5432"

volumes:
  postgres-data:
  strapi-uploads:

networks:
  fxn-net:
    driver: bridge
